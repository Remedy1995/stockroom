services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://stockroom:stockroom@db:5432/stockroom
      ALLOWED_ORIGINS: '["https://stockroom.example.com"]'
      ALLOWED_HOSTS: '["stockroom.example.com","localhost"]'
      SECURE_COOKIES: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  postgres-data:
