services:
  - type: web
    name: stockroom-api-remedy1995
    runtime: docker
    repo: https://github.com/Remedy1995/stockroom
    branch: main
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockroom-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

databases:
  - name: stockroom-db
    plan: free
    region: frankfurt
    databaseName: stockroom
    user: stockroom
